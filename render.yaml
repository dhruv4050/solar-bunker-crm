services:
  - type: web
    name: solar-bunker-crm
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CRM_API_KEY
        sync: false
      - key: DB_PATH
        value: ./data/solar_bunker_crm.db
